services:
  postgres:
    image: postgres:14-alpine
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - PGDATA=/var/lib/postgresql/data/pgdata
      - POSTGRES_USER=skyvern
      - POSTGRES_PASSWORD=skyvern
      - POSTGRES_DB=skyvern
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skyvern"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - skyvern-network

  skyvern:
    build:
      context: .
      dockerfile: Dockerfile
    restart: on-failure
    ports:
      - "8001:8000"
      - "9222:9222"
      - "6080:6080"
    volumes:
      - ./artifacts:/data/artifacts
      - ./videos:/data/videos
      - ./har:/data/har
      - ./log:/data/log
      - ./.streamlit:/app/.streamlit
    environment:
      - DATABASE_STRING=postgresql+psycopg://skyvern:skyvern@postgres:5432/skyvern
      - BROWSER_TYPE=chromium-headful
      - ENABLE_OPENAI=true
      - LLM_KEY=OPENAI_GPT4O
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - CAPTCHA_SOLVING_ENABLED=true
      - TWOCAPTCHA_API_KEY=${TWOCAPTCHA_API_KEY}
      - CAPTCHA_POLLING_INTERVAL_SECONDS=5
      - CAPTCHA_SOLVING_TIMEOUT_SECONDS=120
      - CAPTCHA_MAX_RETRIES=3
      - LOG_LEVEL=INFO
      - SKYVERN_TELEMETRY=false
      - ENABLE_STREAMING=true
      - ENABLE_VNC=true
      - VNC_WS_HOST=0.0.0.0
      - VNC_WS_PORT=6080
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - skyvern-network

  skyvern-ui:
    image: public.ecr.aws/skyvern/skyvern-ui:latest
    restart: on-failure
    ports:
      - "8080:8080"
      - "9090:9090"
    volumes:
      - ./artifacts:/data/artifacts
      - ./videos:/data/videos
      - ./har:/data/har
      - ./.streamlit:/app/.streamlit
    environment:
      - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://localhost:8001/api/v1}
      - VITE_WSS_BASE_URL=${VITE_WSS_BASE_URL:-ws://localhost:8001/api/v1}
      - VITE_ARTIFACT_API_BASE_URL=${VITE_ARTIFACT_API_BASE_URL:-http://localhost:9090}
    depends_on:
      - skyvern
    networks:
      - skyvern-network

networks:
  skyvern-network:
    driver: bridge

volumes:
  postgres_data:
